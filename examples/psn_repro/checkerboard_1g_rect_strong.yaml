# PSN2D example — checkerboard benchmark (paper Sec 4.1, Fig.3), STRONG absorber
# RECT version (uniform 1 cm nodes) for the high-order (A=3) closure path.
# Geometrically identical to checkerboard_1g_strong.yaml (square path).
#
# fuel/absorber checkerboard, reflective on all four sides. 1 energy group.
# OpenMC reference: strong=0.51673 (paper pcm = ABSOLUTE (k-kref)*1e5).
problem: checkerboard
description: >
  PSN Fig.3 checkerboard (rect formulation), 1 group, fuel (St=1.5,
  Sa=0.15, nuSf=0.24) / absorber (St=1.0, Sa=strong 0.70), 2x2 base cells
  subdivided S x S.

geometry:
  rect: true
  mat_grid:   # bottom row first; columns left->right  (0=fuel, 1=absorber)
    - [1, 0]
    - [0, 1]
  widths_x: 1.0
  widths_y: 1.0
  subdivide: 4

boundaries:
  left: reflect
  bottom: reflect
  right: reflect
  top: reflect

materials:
  - name: fuel
    total: [1.5]
    scatter: [[1.35]]
    nu_fission: [0.24]
  - name: absorber_strong
    total: [1.0]
    scatter: [[0.30]]
    nu_fission: [0.0]

fission_spectrum: [1.0]

angular:
  model: ty3
  M: 12
  A: 3
  closure: directional_matrix

# --- Study III (paper Sec 5): A=3 checkerboard sweeps ----------------------
# "S" in case names = paper S (grid 2S x 2S = 2*S subdivide).
# ty3_* : three-polar (TY3) protocol, S=1..12, 72 points
# i30_* : generic even polar set I=30, S=1..20, 120 points
# i60_* : I=60 repeat at S=20 M=24 (polar-sector sensitivity)
# kref = OpenMC value from the source paper (five decimals).
solver:
  keff_tol: 1.0e-07
  max_outer: 6000
  inner: gmres
  gmres_rtol: 1.0e-07
  gmres_maxiter: 800
  gmres_pairs: on

cases:
  - { name: strong_M12, M: 12, subdivide: 4, kref: 0.51673, A: 0, closure: legacy }
  - { name: ty3_M2_S1, M: 2, subdivide: 1, kref: 0.51673, A: 3, closure: directional_matrix }
  - { name: ty3_M4_S1, M: 4, subdivide: 1, kref: 0.51673, A: 3, closure: directional_matrix }
