# PSN2D — C5G7 rect4x4 UO2 assembly, 4x4 rectangular nodes, PURE XS
# Topology (user-confirmed 2026-09-14): centre 2x2 nodes = UO2 FUEL,
# outer ONE ring of water (NO water between fuel nodes).
#
# Cartesian node grid (node-method requirement: shared interfaces):
#   x-widths depend on COLUMN only  -> every row of widths_x =
#     [w, f, f, w]
#   y-widths depend on ROW only     -> widths_y rows =
#     [w,w,w,w] / [f,f,f,f] / [f,f,f,f] / [w,w,w,w]
#   with w = 0.1514375 cm (water half-gap, rect3x3 convention) and
#   f = 0.9571251 cm (fuel diameter).
#   => 4 water corner nodes w x w, 4 water edge strips (f x w or
#      w x f), 4 fuel nodes f x f.  Side = 2*f + 2*w = 2.2171251 cm.
# S=1: 4x4 nodes.  S=2: uniform 2x2 subdivision -> 8x8 (fuel 2x2 ->
# 4x4 sub-nodes, each edge water node -> 2 segments).
# All four faces reflective.
# XS: c5g7_materials_pure.yaml (unhomogenized, c5g7-mgxs.h5)
