angular:
  model: ty3
  M: 12
  A: 3
  closure: directional_matrix
# --- Study III (paper Sec 5): A=3 directional closure sweep -------------
# Angular defaults below apply to every case: A=3 (K=4 angular unknowns),
# directional_matrix closure, TY3 polar protocol.  Inner solve: GMRES pool
# with relative linear-residual tolerance 1e-7 (== outer gate), restart
# 20, max 800 internal Krylov iterations (see studyIII.tex).
# kref = same-geometry pure-XS OpenMC reference (assembly, rect rods).
solver:
  keff_tol: 1.0e-07
  max_outer: 6000
  inner: gmres
  gmres_rtol: 1.0e-07
  gmres_maxiter: 800
  gmres_pairs: on

