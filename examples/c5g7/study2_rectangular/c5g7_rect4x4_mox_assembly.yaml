# PSN2D — C5G7 rect4x4 MOX: ONE rect3x3 PIN CELL with the fuel square
# split into 2x2 = 4 blocks (user decision 2026-09-14: "rect4 应该是
# 完全相同的几何只是 pin 中间分成 4 块").  Fuel = mat index 2 (mox43,
# same material as the rect3x3 MOX main pins).
#
# Geometry = rect3x3 pin cell (pitch 1.26 cm, all-reflective):
#   side = f + 2w = 0.9571251 + 2*0.1514375 = 1.26 cm
#   fuel: one 0.9571251-cm square in the centre, split into 2x2 blocks
#         of f/2 = 0.4785625 cm (blocks touch, no water between ->
#         material regions identical to the rect3x3 cell)
#   water: ring of w = 0.1514375 cm on all four sides (the full
#         0.3029-cm gap between adjacent cells, as in rect3x3)
#   water area fraction = 1 - (f/side)^2 = 42.3% (same as rect3x3)
# A single reflective pin cell is one unit cell of the 17x17 assembly,
# so keff is expected within a few pcm of the assembly anchors
# (UO2 1.3347260 / MOX 1.1851053, OpenMC).
#
# S1 = 4x4 nodes: widths [w, f/2, f/2, w] (x = y)
# S2 = 8x8: subdivide=2 -> fuel 2x2 -> 4x4 sub-nodes (f/4),
#      each water node -> 2 (w/2)
# All four faces reflective. XS: c5g7_materials_pure.yaml.
