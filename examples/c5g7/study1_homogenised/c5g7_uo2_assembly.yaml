# PSN2D — C5G7 single UO2 assembly (17x17, reflective, pin-homogenized) (7-group, OpenMOC c5g7-mgxs.h5 cross sections)
#
# 17x17 pin assemblies, pitch 1.26 cm, homogenized pin cells (fuel+water).
# one 17x17 UO2 assembly; all-reflective boundary; pin = fuel(r=0.54) + water ring.
#
# Reference eigenvalues (7-group):
#   MCNP5 (C5G7 benchmark, nTRACER, SPHINCS 2021 Table 1 (pin-cell XS with SPH factors)):  k = 1.33367
#   PSN2D pin-homogenized infinite-medium k_inf = 1.32937 (+/-43 pcm data basis)
problem: c5g7_uo2_assembly
description: C5G7 single UO2 assembly (17x17, reflective, pin-homogenized), 7-group PSN2D.

